name: Publish XPI

on:
  release:
    types:
      - created

jobs:
  build-and-upload:
    name: Build and upload XPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build XPI package
        run: |
          XPI_NAME="openvidu-meet-provisioner-v${{ steps.version.outputs.version }}.xpi"
          zip -r "$XPI_NAME" \
            manifest.json \
            background.js \
            icons/ \
            sidebar/ \
            content/ \
            options/ \
            src/
          echo "xpi_name=$XPI_NAME" >> "$GITHUB_ENV"

      - name: Upload XPI to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            "${{ env.xpi_name }}" \
            --clobber
