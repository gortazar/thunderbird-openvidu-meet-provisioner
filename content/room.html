<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenVidu Meet</title>
    <link rel="stylesheet" href="room.css" />
  </head>
  <body>
    <div id="toolbar" class="toolbar">
      <div class="toolbar-left">
        <img src="../icons/icon.svg" class="toolbar-icon" alt="" />
        <span id="room-title" class="room-title">Loading…</span>
      </div>
      <div class="toolbar-right">
        <button id="open-external-btn" class="toolbar-btn" title="Open in browser">
          &#x2197; Open in browser
        </button>
        <button id="close-btn" class="toolbar-btn" title="Close tab">
          &#x2715; Close
        </button>
      </div>
    </div>

    <div id="frame-container" class="frame-container">
      <iframe
        id="room-frame"
        class="room-frame"
        allow="camera; microphone; display-capture; autoplay; clipboard-write; encrypted-media; fullscreen"
        allowfullscreen
      ></iframe>
      <div id="error-overlay" class="error-overlay hidden">
        <div class="error-box">
          <h2>&#x26A0; Cannot load room</h2>
          <p id="error-message"></p>
          <p>
            <a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">
              Open room directly in browser
            </a>
          </p>
        </div>
      </div>
    </div>

    <script src="room.js"></script>
  </body>
</html>
