<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="10" fill="#0066cc"/>
  <!-- Camera body -->
  <rect x="6" y="16" width="38" height="26" rx="4" fill="white"/>
  <!-- Camera lens -->
  <circle cx="25" cy="29" r="8" fill="#0066cc"/>
  <circle cx="25" cy="29" r="5" fill="#004499"/>
  <!-- Camera viewfinder/record indicator -->
  <circle cx="38" cy="20" r="3" fill="#ff4444"/>
  <!-- Camera lens highlight -->
  <circle cx="23" cy="27" r="2" fill="white" opacity="0.4"/>
  <!-- Camera side extension (zoom lens) -->
  <polygon points="44,20 58,14 58,44 44,38" fill="white"/>
  <!-- Stand/tripod base -->
  <rect x="18" y="44" width="28" height="3" rx="1.5" fill="white"/>
  <rect x="28" y="47" width="8" height="5" fill="white"/>
</svg>
